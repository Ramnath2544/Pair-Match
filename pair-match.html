<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match Game</title>
  <style>
    /* CSS */
    body {
      background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
      color: white;
      font-family: "Arial", sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .game-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 90%;
    }

    .title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      animation: titleGlow 2s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      to {
        text-shadow: 2px 2px 20px rgba(255, 255, 255, 0.4);
      }
    }

    /* Score Board Styling */
    .score-board {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .status {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: bold;
      height: 25px;
      color: #ffd700;
      transition: color 0.3s ease;
    }

    /* Grid layout for 16 cards */
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 30px;
      perspective: 1000px;
      /* Required for 3D flip effect */
    }

    .card {
      aspect-ratio: 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s;
    }

    .card:active {
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .card.flip {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* The side facing the user initially (hidden icon) */
    .card-front {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.5);
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.1) 75%, transparent 75%, transparent);
      background-size: 20px 20px;
    }

    .card-front:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* The side containing the emoji */
    .card-back {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #ffd700;
      transform: rotateY(180deg);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .controls-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      font-size: 14px;
      font-weight: bold;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 25px;
      color: white;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .reset-game-btn {
      background: linear-gradient(145deg, #4caf50, #388e3c);
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
    }

    .reset-game-btn:hover {
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
      transform: translateY(-2px);
    }

    .clear-score-btn {
      background: linear-gradient(145deg, #f44336, #d32f2f);
      box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
    }

    .clear-score-btn:hover {
      box-shadow: 0 6px 20px rgba(244, 67, 54, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <!-- HTML -->
  <div class="game-container">
    <div class="title">Memory Match</div>

    <!-- Score Board -->
    <div class="score-board">
      <div>Moves: <span class="js-moves">0</span></div>
      <div>Best (Lowest): <span class="js-best">--</span></div>
    </div>

    <div class="status js-status">Find all pairs!</div>

    <div class="board js-board">
      <!-- Cards generated by JS -->
    </div>

    <div class="controls-container">
      <button class="btn reset-game-btn js-reset-button">Restart Game</button>
      <button class="btn clear-score-btn js-clear-score-button">Clear Best Score</button>
    </div>
  </div>

  <script>
    // JavaScript
    const boardElement = document.querySelector('.js-board');
    const statusText = document.querySelector('.js-status');
    const movesText = document.querySelector('.js-moves');
    const bestText = document.querySelector('.js-best');
    const resetButton = document.querySelector('.js-reset-button');
    const clearScoreButton = document.querySelector('.js-clear-score-button');

    // Emojis for the 8 pairs
    const emojis = ['🌟', '🚀', '🎸', '💎', '🌈', '🔥', '🧩', '🍔'];
    let cardsArray = [...emojis, ...emojis];

    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let moves = 0;
    let matchedPairs = 0;

    // Load best score from localStorage
    let bestScore = localStorage.getItem('memoryMatchBestScore');
    updateScoreDisplay();

    function updateScoreDisplay() {
      movesText.innerText = moves;
      bestText.innerText = bestScore ? bestScore : '--';
    }

    function shuffleCards() {
      for (let i = cardsArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cardsArray[i], cardsArray[j]] = [cardsArray[j], cardsArray[i]];
      }
    }

    function createBoard() {
      boardElement.innerHTML = '';
      shuffleCards();

      cardsArray.forEach((emoji, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.name = emoji;

        const cardFront = document.createElement('div');
        cardFront.classList.add('card-front');

        const cardBack = document.createElement('div');
        cardBack.classList.add('card-back');
        cardBack.innerText = emoji;

        card.appendChild(cardFront);
        card.appendChild(cardBack);

        card.addEventListener('click', flipCard);
        boardElement.appendChild(card);
      });
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return; // Prevent double clicking same card

      this.classList.add('flip');

      if (!hasFlippedCard) {
        // First click
        hasFlippedCard = true;
        firstCard = this;
        return;
      }

      // Second click
      secondCard = this;
      moves++;
      updateScoreDisplay();
      checkForMatch();
    }

    function checkForMatch() {
      let isMatch = firstCard.dataset.name === secondCard.dataset.name;

      if (isMatch) {
        disableCards();
      } else {
        unflipCards();
      }
    }

    function disableCards() {
      firstCard.removeEventListener('click', flipCard);
      secondCard.removeEventListener('click', flipCard);

      matchedPairs++;
      if (matchedPairs === 8) {
        endGame();
      }

      resetBoardState();
    }

    function unflipCards() {
      lockBoard = true;

      setTimeout(() => {
        firstCard.classList.remove('flip');
        secondCard.classList.remove('flip');
        resetBoardState();
      }, 1000); // 1 second delay before flipping back
    }

    function resetBoardState() {
      [hasFlippedCard, lockBoard] = [false, false];
      [firstCard, secondCard] = [null, null];
    }

    function endGame() {
      statusText.innerText = `🎉 You won in ${moves} moves!`;
      statusText.style.color = '#4caf50';

      // Check and update best score
      if (!bestScore || moves < bestScore) {
        bestScore = moves;
        localStorage.setItem('memoryMatchBestScore', bestScore);
        updateScoreDisplay();
        statusText.innerText = `🎉 New Best Score: ${moves} moves!`;
      }
    }

    function resetGame() {
      moves = 0;
      matchedPairs = 0;
      hasFlippedCard = false;
      lockBoard = false;
      firstCard = null;
      secondCard = null;

      statusText.innerText = 'Find all pairs!';
      statusText.style.color = '#ffd700';

      updateScoreDisplay();
      createBoard();
    }

    function clearScore() {
      bestScore = null;
      localStorage.removeItem('memoryMatchBestScore');
      updateScoreDisplay();
    }

    // Event Listeners for buttons
    resetButton.addEventListener('click', resetGame);
    clearScoreButton.addEventListener('click', clearScore);

    // Initialize Game
    createBoard();
  </script>
</body>

</html>
